<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0052a5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>مشاويري 🇦🇪 - Mashawiri UAE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/tajawal@5.1.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/tajawal@5.1.0/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/tajawal@5.1.0/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/tajawal@5.1.0/800.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/tajawal@5.1.0/900.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#0052a5;--primary-dark:#003d7a;--secondary:#c8102e;--accent:#00ab6c;--gold:#d4af37;--bg:#f5f7fa;--card:#fff;--text:#1a2332;--muted:#64748b;--border:#e2e8f0;--danger:#ef4444;--warning:#f59e0b;--pink:#be185d;--shadow:0 4px 20px rgba(0,0,0,.06);--shadow-lg:0 10px 40px rgba(0,0,0,.12);--input:#f8fafc}
html[data-theme="dark"]{--bg:#0b1220;--card:#141d31;--text:#e6edf7;--muted:#94a3b8;--border:#243149;--input:#0f1728;--shadow:0 4px 20px rgba(0,0,0,.35);--shadow-lg:0 10px 40px rgba(0,0,0,.5)}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
body.zoom-1{zoom:1.12}body.zoom-2{zoom:1.25}
button{font-family:'Tajawal',sans-serif}input,select,textarea{font-family:'Tajawal',sans-serif;color:var(--text)}
html[dir="ltr"] .route-line{margin-left:0;margin-right:12px}
html[dir="ltr"] .trip-price{margin-right:0;margin-left:auto}
html[dir="ltr"] .sort-select{margin-right:0;margin-left:auto}
html[dir="ltr"] .unread-badge{margin-left:0;margin-right:auto}
.top-nav{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,82,165,.25)}
.nav-container{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;cursor:pointer}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--gold),#f0c850);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.nav-links{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.nav-link{padding:9px 14px;border-radius:10px;color:rgba(255,255,255,.85);font-weight:700;font-size:13.5px;cursor:pointer;border:none;background:transparent;transition:.2s}
.nav-link:hover{background:rgba(255,255,255,.15);color:#fff}
.nav-link.active{background:rgba(255,255,255,.22);color:#fff}
.nav-user{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:16px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:rgba(255,255,255,.28)}
.notif-dot{position:absolute;top:-3px;left:-3px;background:var(--secondary);color:#fff;min-width:18px;height:18px;border-radius:9px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--primary-dark)}
.user-avatar-nav{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#f0c850);display:none;align-items:center;justify-content:center;font-weight:900;color:var(--primary-dark);cursor:pointer;border:2px solid rgba(255,255,255,.4)}
.btn-login{padding:9px 16px;border-radius:10px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);font-weight:700;font-size:13.5px;cursor:pointer}
.notif-drop{position:absolute;top:52px;left:20px;width:330px;max-width:92vw;background:var(--card);color:var(--text);border-radius:16px;box-shadow:var(--shadow-lg);z-index:300;display:none;overflow:hidden;border:1px solid var(--border)}
.notif-drop.open{display:block}
.notif-head{padding:14px 16px;font-weight:800;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:14px}
.notif-head button{border:none;background:none;color:var(--primary);font-weight:700;font-size:12px;cursor:pointer}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;font-size:13px;line-height:1.6;align-items:flex-start}
.notif-item.unread{background:rgba(0,82,165,.06)}
.notif-item .ic{font-size:18px}.notif-item .tm{font-size:11px;color:var(--muted);margin-top:2px}
/* SIDEBAR */
#sidebar{position:fixed;top:0;bottom:0;right:0;width:270px;max-width:85vw;background:var(--card);z-index:500;transform:translateX(105%);transition:transform .3s;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow-y:auto}
html[dir="ltr"] #sidebar{right:auto;left:0;transform:translateX(-105%)}
#sidebar.open{transform:translateX(0)!important}
#sideBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:490;display:none}
#sideBackdrop.open{display:block}
.side-head{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:17px}
.side-head button{background:rgba(255,255,255,.2);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer}
.side-item{display:flex;align-items:center;gap:10px;padding:13px 18px;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;border:none;background:none;width:100%;text-align:start;border-bottom:1px solid var(--border)}
.side-item:hover{background:var(--bg)}
.side-item.active{background:var(--bg);color:var(--primary);border-inline-start:4px solid var(--primary)}
.side-sep{height:8px;background:var(--bg)}
.side-foot{margin-top:auto;padding:14px 18px;font-size:11.5px;color:var(--muted);font-weight:700}
.wa-btn{margin:10px 18px;padding:11px;border:none;border-radius:12px;background:#25d366;color:#fff;font-weight:800;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
/* BACK BTN */
#backBtn{display:none}
.hero{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:50px 20px 85px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40%;right:-15%;width:600px;height:600px;background:radial-gradient(circle,rgba(212,175,55,.18),transparent 70%);border-radius:50%}
.hero-content{max-width:1100px;margin:0 auto;position:relative;z-index:2;text-align:center}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);padding:8px 18px;border-radius:30px;font-size:13.5px;font-weight:700;margin-bottom:18px}
.hero h1{font-size:42px;font-weight:900;margin-bottom:12px;line-height:1.35}
.hero h1 span{color:var(--gold)}
.hero p{font-size:17px;opacity:.92;margin:0 auto 30px;max-width:640px;line-height:1.8}
.search-main{background:var(--card);color:var(--text);border-radius:20px;padding:18px;max-width:920px;margin:0 auto;box-shadow:var(--shadow-lg);display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;text-align:start}
.search-field{display:flex;flex-direction:column;gap:6px;position:relative}
.search-field label{font-size:12px;font-weight:800;color:var(--muted)}
.search-field input{padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:14px;font-weight:700;outline:none;background:var(--input)}
.search-field input:focus{border-color:var(--primary)}
.ac-list{position:absolute;top:100%;right:0;left:0;background:var(--card);border:2px solid var(--primary);border-radius:12px;z-index:50;max-height:200px;overflow-y:auto;display:none;box-shadow:var(--shadow-lg)}
.ac-list.open{display:block}
.ac-item{padding:10px 14px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text)}
.ac-item:hover{background:var(--bg)}
.search-btn{padding:12px 28px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;height:47px}
.recent-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.recent-chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}
.recent-chip .x{opacity:.7;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1200px;margin:-48px auto 26px;padding:0 20px;position:relative;z-index:3}
.stat-card{background:var(--card);border-radius:16px;padding:20px 12px;text-align:center;box-shadow:var(--shadow)}
.stat-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:24px}
.stat-value{font-size:26px;font-weight:900;color:var(--text)}
.stat-label{font-size:12.5px;color:var(--muted);font-weight:700}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.section{padding:30px 0}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.section-title{font-size:24px;font-weight:900;color:var(--text)}
.section-title span{color:var(--primary)}
html[data-theme="dark"] .section-title span{color:#6db3f2}
.section-subtitle{font-size:13.5px;color:var(--muted);margin-top:4px;font-weight:500}
.ad-banner{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;margin:16px 0;box-shadow:var(--shadow)}
.ad-banner .ad-tag{background:rgba(0,0,0,.25);padding:3px 10px;border-radius:8px;font-size:10.5px;font-weight:800}
.ad-banner strong{font-size:15px}
.ad-banner .ad-actions{display:flex;gap:8px;flex-wrap:wrap}
.ad-banner button{border:none;border-radius:10px;padding:9px 14px;font-weight:800;font-size:12.5px;cursor:pointer}
.ad-btn-light{background:#fff;color:#b45309}.ad-btn-dark{background:rgba(0,0,0,.3);color:#fff}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;background:var(--card);padding:12px;border-radius:16px;box-shadow:var(--shadow);align-items:center}
.filter-chip{padding:9px 16px;border-radius:12px;border:2px solid var(--border);background:var(--card);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text);transition:.2s}
.filter-chip:hover{border-color:var(--primary);color:var(--primary)}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.sort-select{margin-right:auto;padding:9px 12px;border-radius:12px;border:2px solid var(--border);background:var(--card);font-size:12.5px;font-weight:700;outline:none;cursor:pointer;color:var(--text)}
.smart-search{width:100%;padding:11px 14px;border-radius:12px;border:2px solid var(--border);background:var(--input);font-size:13.5px;outline:none;margin-bottom:10px;color:var(--text)}
.smart-search:focus{border-color:var(--primary)}
.trips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.trip-card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;transition:.25s;position:relative;color:var(--text)}
.trip-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.trip-card.premium-card{border-color:var(--gold)}
.premium-ribbon{position:absolute;top:-10px;left:14px;background:linear-gradient(135deg,var(--gold),#f0c850);color:#3b2f00;font-size:10.5px;font-weight:900;padding:3px 10px;border-radius:8px}
.trip-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:8px}
.trip-user{display:flex;align-items:center;gap:10px}
.trip-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:#fff;position:relative;flex-shrink:0}
.trip-avatar.male{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.trip-avatar.female{background:linear-gradient(135deg,#ec4899,#be185d)}
.verified-badge{position:absolute;bottom:-2px;right:-2px;width:17px;height:17px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;border:2px solid var(--card);color:#fff}
.trip-user-info h4{font-size:14.5px;font-weight:800;margin-bottom:2px}
.trip-rating{font-size:11.5px;color:var(--gold);font-weight:700}
.trust-pill{background:rgba(0,171,108,.12);color:var(--accent);padding:2px 8px;border-radius:8px;font-size:10.5px;font-weight:800}
.trip-type-badge{padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:800;white-space:nowrap}
.trip-type-badge.driver{background:#dbeafe;color:#1d4ed8}
.trip-type-badge.passenger{background:#fce7f3;color:#be185d}
html[data-theme="dark"] .trip-type-badge.driver{background:rgba(59,130,246,.2)}
html[data-theme="dark"] .trip-type-badge.passenger{background:rgba(236,72,153,.2)}
.female-badge{background:#fce7f3;color:var(--pink);padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800}
html[data-theme="dark"] .female-badge{background:rgba(236,72,153,.2)}
.trip-route{display:flex;align-items:stretch;margin-bottom:12px;padding-right:4px}
.route-line{display:flex;flex-direction:column;align-items:center;margin-left:12px;padding:5px 0}
.route-dot{width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid var(--card);box-shadow:0 0 0 2px var(--accent)}
.route-dot.end{background:var(--secondary);box-shadow:0 0 0 2px var(--secondary)}
.route-connector{width:2px;flex:1;background:linear-gradient(to bottom,var(--accent),var(--secondary));margin:3px 0}
.route-info{flex:1}
.route-point{padding:6px 0}
.route-point .city{font-size:10.5px;color:var(--muted);font-weight:700}
.route-point .location{font-size:15px;font-weight:800}
.trip-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:12px;border-top:1px solid var(--border)}
.meta-item{font-size:12px;color:var(--muted);font-weight:700}
.trip-price{margin-right:auto;background:linear-gradient(135deg,var(--accent),#059669);color:#fff;padding:5px 12px;border-radius:10px;font-weight:800;font-size:12.5px}
.ai-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ai-badge{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:8px}
.ai-badge.hot{background:rgba(239,68,68,.12);color:var(--danger)}
.ai-badge.fair{background:rgba(0,171,108,.12);color:var(--accent)}
.ai-badge.high{background:rgba(245,158,11,.15);color:#b45309}
html[data-theme="dark"] .ai-badge.high{color:var(--warning)}
.ai-badge.match{background:rgba(0,82,165,.1);color:var(--primary)}
html[data-theme="dark"] .ai-badge.match{color:#6db3f2}
.features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.feature-card{background:var(--card);border-radius:18px;padding:26px 20px;text-align:center;box-shadow:var(--shadow);color:var(--text)}
.feature-icon{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px}
.feature-card h3{font-size:17px;font-weight:800;margin-bottom:8px}
.feature-card p{font-size:13.5px;color:var(--muted);line-height:1.7}
.cta-section{background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:24px;padding:44px 30px;color:#fff;text-align:center;margin:26px 0 44px}
.cta-section h2{font-size:29px;font-weight:900;margin-bottom:10px}
.cta-section p{font-size:15px;opacity:.92;margin-bottom:24px}
.cta-btn{padding:14px 34px;background:var(--gold);color:#3b2f00;border:none;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer}
.footer{background:#101828;color:#fff;padding:44px 20px 18px}
.footer-grid{max-width:1200px;margin:0 auto 26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px}
.footer-col h4{font-size:15px;font-weight:800;margin-bottom:14px;color:var(--gold)}
.footer-col a{display:block;color:rgba(255,255,255,.7);text-decoration:none;padding:5px 0;font-size:13.5px;cursor:pointer}
.footer-col a:hover{color:#fff}
.footer-col p{color:rgba(255,255,255,.7);font-size:13.5px;line-height:1.8}
.footer-bottom{max-width:1200px;margin:0 auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);text-align:center;font-size:12.5px;color:rgba(255,255,255,.5)}
.form-group{margin-bottom:16px;text-align:start}
.form-group>label{display:block;font-size:13.5px;font-weight:800;margin-bottom:7px}
.form-control{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:14px;font-weight:600;outline:none;background:var(--input);transition:.2s}
.form-control:focus{border-color:var(--primary)}
textarea.form-control{min-height:90px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{padding:12px 22px;border-radius:12px;border:none;font-size:14px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,82,165,.35)}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-success{background:linear-gradient(135deg,var(--accent),#059669);color:#fff}
.btn-gold{background:linear-gradient(135deg,var(--gold),#f0c850);color:#3b2f00}
.btn-danger{background:var(--danger);color:#fff}
.btn-wa{background:#25d366;color:#fff}
.btn-block{width:100%}
.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:10px}
.wizard-steps{display:flex;gap:6px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.wstep{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
.wstep .num{width:28px;height:28px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:13px}
.wstep.active{color:var(--primary)}.wstep.active .num{background:var(--primary);color:#fff}
.wstep.done .num{background:var(--accent);color:#fff}
.wizard-nav{display:flex;gap:10px;margin-top:18px}
.auth-container{max-width:460px;margin:36px auto;padding:0 20px}
.auth-card{background:var(--card);border-radius:20px;padding:32px;box-shadow:var(--shadow-lg);color:var(--text)}
.auth-header{text-align:center;margin-bottom:22px}
.auth-header h2{font-size:24px;font-weight:900;margin-bottom:6px}
.auth-header p{color:var(--muted);font-size:13.5px}
.auth-tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--bg);padding:5px;border-radius:12px}
.auth-tab{flex:1;padding:11px;border:none;background:transparent;font-weight:800;font-size:14px;cursor:pointer;border-radius:10px;color:var(--muted)}
.auth-tab.active{background:var(--card);color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.08)}
html[data-theme="dark"] .auth-tab.active{color:#6db3f2}
.social-login{display:flex;gap:10px}
.social-btn{flex:1;padding:12px;border:2px solid var(--border);border-radius:12px;background:var(--card);cursor:pointer;font-size:13px;font-weight:700;color:var(--text)}
.trip-detail{max-width:900px;margin:26px auto;padding:0 20px}
.detail-card{background:var(--card);border-radius:20px;padding:26px;box-shadow:var(--shadow);color:var(--text)}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:14px}
.detail-user{display:flex;align-items:center;gap:14px}
.detail-avatar{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff}
.detail-user-info h2{font-size:21px;font-weight:900;margin-bottom:4px}
.detail-user-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:700}
.detail-route-large{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;padding:24px;background:var(--bg);border-radius:16px;margin-bottom:20px}
.detail-route-point{text-align:center}
.detail-route-point .label{font-size:11.5px;color:var(--muted);font-weight:800;margin-bottom:5px}
.detail-route-point .value{font-size:19px;font-weight:900}

.conversation-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;flex-shrink:0}
.conversation-info{flex:1;min-width:0}
.conversation-name{font-weight:800;font-size:13.5px;color:var(--text)}
.conversation-last{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread-badge{background:var(--secondary);color:#fff;min-width:19px;height:19px;border-radius:10px;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;margin-left:auto;margin-top:4px}
.chat-area{background:var(--card);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.chat-header{padding:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;color:var(--text)}
.chat-messages{flex:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}

.message.received{background:var(--bg);color:var(--text);align-self:flex-start;border-bottom-right-radius:4px}

.tpl-row{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}

.chat-input input{flex:1;padding:11px 15px;border:2px solid var(--border);border-radius:12px;font-size:13.5px;outline:none;background:var(--input)}
.profile-header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:42px 20px 58px;text-align:center}
.profile-avatar-large{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#f0c850);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#3b2f00;margin:0 auto 14px;border:4px solid rgba(255,255,255,.4)}

.profile-stats{display:flex;justify-content:center;gap:36px;margin-top:18px}

.active-trip-card{background:linear-gradient(135deg,#065f46,#059669);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}

.sos-btn{background:var(--danger);color:#fff;animation:pulse 1.6s infinite}

.store-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}

.store-card h3{font-size:18px;font-weight:900;margin-bottom:6px}
.store-price{font-size:32px;font-weight:900;color:var(--primary);margin:10px 0}
html[data-theme="dark"] .store-price{color:#6db3f2}
.store-price small{font-size:13px;color:var(--muted);font-weight:700}
.store-feats{list-style:none;text-align:start;margin:14px 0;font-size:13px;line-height:2}

.points-box .pts{font-size:40px;font-weight:900}
.assistant-fab{position:fixed;bottom:86px;left:18px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 6px 24px rgba(0,82,165,.45);z-index:120;display:flex;align-items:center;justify-content:center}
.assistant-panel{position:fixed;bottom:86px;left:18px;width:360px;max-width:calc(100vw - 36px);height:480px;max-height:70vh;background:var(--card);border-radius:20px;box-shadow:var(--shadow-lg);z-index:130;display:none;flex-direction:column;overflow:hidden;border:1px solid var(--border)}
.assistant-panel.open{display:flex}
.assistant-head{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:14px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center;font-size:14.5px}
.assistant-head button{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer}
.assistant-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bot-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:12.5px;cursor:pointer;color:var(--text)}
.bot-card:hover{border-color:var(--primary)}
.bot-card b{display:block;font-size:13.5px;margin-bottom:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:20px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;animation:modalIn .25s ease;color:var(--text)}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:18px;font-weight:900}
.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg);color:var(--text);cursor:pointer;font-size:16px}
.modal-body{padding:22px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.star-row{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.star-row .lbl{width:130px;font-size:13px;font-weight:700}
.star{font-size:24px;cursor:pointer;color:var(--border)}
.star.on{color:var(--gold)}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--text);color:var(--bg);padding:13px 24px;border-radius:12px;font-size:14px;font-weight:700;z-index:600;opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--shadow-lg);max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--accent);color:#fff}
.toast.error{background:var(--danger);color:#fff}
.toast.warning{background:var(--warning);color:#1a2332}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-state-icon{font-size:56px;margin-bottom:14px;opacity:.5}
.empty-state h3{font-size:19px;font-weight:800;margin-bottom:6px;color:var(--text)}
.page{display:none;animation:fadeIn .3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);z-index:150;padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}
.mobile-nav button{border:none;background:none;font-size:10.5px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 8px;border-radius:10px}
.mobile-nav button .ic{font-size:19px}
.mobile-nav button.active{color:var(--primary);background:var(--bg)}
html[data-theme="dark"] .mobile-nav button.active{color:#6db3f2}
.route-save-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);padding:12px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px}
.route-save-row select,.route-save-row input{padding:9px 10px;border:2px solid var(--border);border-radius:10px;background:var(--input);font-size:12.5px;font-weight:700;outline:none;color:var(--text)}
.fq-route{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:13px 16px;box-shadow:var(--shadow);margin-bottom:10px;flex-wrap:wrap;color:var(--text)}
.fq-route b{font-size:14px}
.fb-card{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px;color:var(--text)}
.fb-card .st{font-size:11px;font-weight:800;padding:3px 10px;border-radius:10px}
.fb-card .st.new{background:rgba(245,158,11,.15);color:#b45309}
.fb-card .st.done{background:rgba(0,171,108,.15);color:var(--accent)}
.adm-stat{background:var(--card);border-radius:14px;padding:18px;box-shadow:var(--shadow);text-align:center}
.adm-stat .v{font-size:24px;font-weight:900;color:var(--primary)}
html[data-theme="dark"] .adm-stat .v{color:#6db3f2}
.adm-stat .l{font-size:12px;color:var(--muted);font-weight:700}
.adm-row{background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--text)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
@media(max-width:900px){.messages-container{grid-template-columns:1fr;height:auto}.conversations-list{max-height:240px}.chat-area{min-height:420px}}
@media(max-width:768px){
 .nav-links{display:none}.mobile-nav{display:flex}body{padding-bottom:64px}
 .hero{padding:34px 14px 74px}.hero h1{font-size:28px}.hero p{font-size:14px}
 .search-main{grid-template-columns:1fr}.search-btn{width:100%}
 .stats{grid-template-columns:repeat(2,1fr);gap:10px;margin-top:-38px}
 .trips-grid{grid-template-columns:1fr}
 .detail-route-large{grid-template-columns:1fr;gap:8px}.route-arrow{transform:rotate(90deg)}
 .form-row{grid-template-columns:1fr}.cta-section h2{font-size:22px}
 .assistant-fab,.assistant-panel{bottom:76px}
}
